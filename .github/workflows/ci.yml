name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: python-client/pyproject.toml
      - name: Install Python client
        run: python -m pip install -e "./python-client[dev]"
      - name: Check Python style
        working-directory: python-client
        run: |
          ruff check .
          ruff format --check .
      - name: Run Python client tests
        run: python -m unittest discover -s python-client/tests -v

  go-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.20.x'
          cache-dependency-path: go-client/go.mod
      - name: Run Go client tests
        working-directory: go-client
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  java-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7
        with:
          path: sdk
      - name: Check out protocol source
        uses: actions/checkout@v7
        with:
          repository: open-rec/rec-server
          path: rec-server
      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install protocol artifact
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f sdk/java-client/ci/rec-proto-pom.xml
          install -DskipTests
      - name: Run Java client tests
        working-directory: sdk/java-client
        run: mvn --batch-mode --no-transfer-progress clean test
